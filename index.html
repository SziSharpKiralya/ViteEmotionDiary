<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite Emotion Diary</title>
  </head>
  <body>
    <div class="main">
      <form id="diary_form">
        <label for="emotion_status">How did you feel today?</label><br />
        <select id="emotion_status" name="emotion_status">
          <option value="😀">😀</option>
          <option value="😐">😐</option>
          <option value="😢">😢</option>
          <option value="😴">😴</option>
          <option value="😡">😡</option>
        </select><br />

        <label for="context_status">Could you elaborate?</label><br />
        <input type="text" id="context_status" name="context_status" /><br />

        <button type="submit">Save to database 💾</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
